services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: awb_maths_hub
      POSTGRES_USER: awb
      POSTGRES_PASSWORD: awb_local_change_me
    volumes:
      - awb_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U awb -d awb_maths_hub"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://awb:awb_local_change_me@db:5432/awb_maths_hub
      JWT_SECRET: change-this-to-a-long-random-secret-at-least-32-characters
      NODE_ENV: production
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "3000:3000"
volumes:
  awb_pgdata:
