services:
  - type: web
    name: awb-maths-hub
    runtime: node
    buildCommand: npm ci --prefix backend
    startCommand: node backend/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: awb-maths-hub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-4o-mini

databases:
  - name: awb-maths-hub-db
